# NDK r29 toolchain, matching out/ReZygisk/common.mk
# (NDK_VERSION 29.0.13113456, API_LEVEL 25). Absolute paths keep plain
# `cargo build --target <triple>` working without cargo-ndk.
#
# The linker wrapper (scripts/ndk-link-wrapper.sh, via per-target symlinks)
# strips rustc's auto-generated --version-script so that
# crates/loader/exports.map alone controls libzygisk.so's exports
# (C-parity `visibility("hidden")`).

[target.aarch64-linux-android]
linker = "/home/nemo/MIX_4_ODIN/out/ReZygisk-RS/scripts/link-aarch64"

[target.armv7-linux-androideabi]
linker = "/home/nemo/MIX_4_ODIN/out/ReZygisk-RS/scripts/link-armv7"

[target.x86_64-linux-android]
linker = "/home/nemo/MIX_4_ODIN/out/ReZygisk-RS/scripts/link-x86_64"

[target.i686-linux-android]
linker = "/home/nemo/MIX_4_ODIN/out/ReZygisk-RS/scripts/link-i686"

[target.'cfg(target_os = "android")']
rustflags = ["-C", "panic=abort"]
