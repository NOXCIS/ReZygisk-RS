[package]
name = "rz-ptracer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zygisk-ptrace"
path = "src/main.rs"

[features]
# Forwarded build-time stealth; see the note in rz-loader's manifest.
stealth-tag = ["rz-common/stealth-tag"]

[dependencies]
libc.workspace = true
nix = { workspace = true, features = ["process", "signal", "poll", "fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
rz-common.workspace = true
rz-ipc.workspace = true
rz-elf.workspace = true
