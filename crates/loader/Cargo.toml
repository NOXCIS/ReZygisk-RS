[package]
name = "rz-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zygisk"
crate-type = ["cdylib"]

[features]
# Forwarded build-time stealth. Without this, `--features stealth-tag` (what
# RZ_FEATURES carries) has nothing to bind to in this crate and the build is
# rejected, leaving tags identifying even when the deploy asked for stealth.
stealth-tag = ["rz-common/stealth-tag"]

[dependencies]
libc.workspace = true
bitflags.workspace = true
jni.workspace = true
static_assertions.workspace = true
regex = "1"
rz-common.workspace = true
rz-ipc.workspace = true
rz-elf.workspace = true
rz-csoloader.workspace = true
rz-plti.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(no_lto_daemon)'] }
